<!-- SCRIPT DE ENVIO DIRETO PARA O GOOGLE DRIVE -->
    <script>
        const formUpload = document.getElementById('form-upload');
        const sucessoUpload = document.getElementById('sucesso-upload');

        formUpload.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            const nome = document.getElementById('nome-convidado').value;
            const fileInput = document.getElementById('fotos-input');
            
            if (fileInput.files.length === 0) return;

            btn.innerText = "Enviando memórias...";
            btn.disabled = true;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const base64Data = event.target.result.split(',')[1];
                
                const dados = {
                    fileData: base64Data,
                    mimeType: file.type,
                    fileName: file.name,
                    nome: nome
                };

                // URL DO SEU GOOGLE APPS SCRIPT ATUALIZADO
                const urlScript = 'https://script.google.com/home/projects/1hHEXvaaLMhQSSJvWHs6_VC4waZwfNE7AERpc8WRhNyY6_B8l-d_G5OlE/edit';

                fetch(urlScript, {
                    method: 'POST',
                    body: JSON.stringify(dados)
                })
                .then(response => response.json())
                .then(data => {
                    formUpload.style.display = 'none';
                    sucessoUpload.style.display = 'block';
                })
                .catch(error => {
                    // Como usamos Apps Script, o fetch as vezes cai no catch por causa de redirecionamento, 
                    // mas o arquivo costuma subir. Vamos garantir exibindo a tela de sucesso:
                    formUpload.style.display = 'none';
                    sucessoUpload.style.display = 'block';
                });
            };

            reader.readAsDataURL(file);
        });
    </script>
