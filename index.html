<script>
        const formUpload = document.getElementById('form-upload');
        const sucessoUpload = document.getElementById('sucesso-upload');

        formUpload.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            const nome = document.getElementById('nome-convidado').value;
            const fileInput = document.getElementById('fotos-input');
            
            if (fileInput.files.length === 0) return;

            btn.innerText = "Enviando memórias...";
            btn.disabled = true;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const base64Data = event.target.result.split(',')[1];
                
                const dados = {
                    fileData: base64Data,
                    mimeType: file.type,
                    fileName: file.name,
                    nome: nome
                };

                // URL DO SEU GOOGLE APPS SCRIPT
                const urlScript = 'https://script.google.com/macros/s/AKfycbwyiqluZLpMC-se2oEgPAdVfUJ-EIlHfK81RhPoi0YNtm67p5yFQ8NNowdhDVAziU_f/exec';

                fetch(urlScript, {
                    method: 'POST',
                    body: JSON.stringify(dados),
                    mode: 'no-cors'
                }).then(() => {
                    formUpload.style.display = 'none';
                    sucessoUpload.style.display = 'block';
                }).catch(() => {
                    alert('Erro ao enviar. Tente novamente.');
                    btn.innerText = "Enviar Memórias 🚀";
                    btn.disabled = false;
                });
            };

            reader.readAsDataURL(file);
        });
    </script>
